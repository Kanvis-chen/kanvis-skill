name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: 离线自测 · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 解析逻辑自测（不联网）
        working-directory: skills/wechat-article
        run: python scripts/selftest.py

      - name: CLI 冒烟
        run: |
          python ks.py list
          python ks.py info wechat-article
