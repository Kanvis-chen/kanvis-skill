name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: 离线自测 · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 在 ubuntu-latest（26.04）上已无预编译包，固定旧 runner 真测低版本
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.11"
            os: ubuntu-latest
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 解析逻辑自测（不联网）
        working-directory: skills/wechat-article
        run: python scripts/selftest.py

      - name: CLI 冒烟
        run: |
          python ks.py list
          python ks.py info wechat-article
